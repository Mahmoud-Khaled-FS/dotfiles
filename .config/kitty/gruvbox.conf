font_family IosevkaTerm Nerd Font Mono
font_size 14
enable_audio_bell no

map ctrl+equal change_font_size all +2.0
map ctrl+minus change_font_size all -2.0
map ctrl+0 change_font_size all 0

# unmap keys
map ctrl+shift+equal discard_event
map ctrl+shift+plus discard_event
map ctrl+shift+kp_add discard_event
map ctrl+shift+minus discard_event
map ctrl+shift+kp_subtract discard_event
map ctrl+shift+backspace discard_event

# Theme

window_padding_width 5

cursor                  #928374
cursor_text_color       background

url_color               #83a598

visual_bell_color       #8ec07c
bell_border_color       #8ec07c

active_border_color     #d3869b
inactive_border_color   #665c54

foreground              #ebdbb2
background              #1d2021
selection_foreground    #928374
selection_background    #ebdbb2

active_tab_foreground   #fbf1c7
active_tab_background   #665c54
inactive_tab_foreground #a89984
inactive_tab_background #3c3836

# black  (bg3/bg4)
color0                  #665c54
color8                  #7c6f64

# red
color1                  #cc241d
color9                  #fb4934

#: green
